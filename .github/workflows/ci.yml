name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Allow unprivileged user namespaces (bubblewrap needs this on Ubuntu 24.04+ runners)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Plan: docs/security/ARCHITECT-ci-gating-cleanup.md §2.3 (Phase B).
      # The tree now reads 8/8 (Auditor sign-off condition, §7 T2/T3), so the
      # runner's own exit code IS the gate: main() returns 0 iff every check
      # passes. `set -o pipefail` is still required — without it
      # `npm run … | tee` returns tee's exit code and a failing audit looks
      # green. The trailing grep is the plan's recommended belt-and-braces
      # assertion against runner-logic drift (a runner that exits 0 without
      # printing 8/8 still reds the pipeline).
      - name: Ground-rule audit
        run: |
          mkdir -p /tmp/opencode
          set -o pipefail
          npm run audit:ground-rules 2>&1 | tee /tmp/opencode/audit.log
          grep -q "8/8 checks passed" /tmp/opencode/audit.log

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
