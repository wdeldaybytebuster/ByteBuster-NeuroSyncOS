<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Golden Gradient for Cerebral Hemisphere Outlines and Nodes -->
        <linearGradient id="goldGradCerebro" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFF2A8" />
            <stop offset="50%" stop-color="#D4AF37" />
            <stop offset="100%" stop-color="#8B7324" />
        </linearGradient>
        <!-- Emerald Gradient for Synaptic Connections -->
        <linearGradient id="emeraldGradCerebro" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="100%" stop-color="#059669" />
        </linearGradient>
    </defs>

    <!-- Symmetrical Left Cerebral Hemisphere Outline -->
    <path d="M 50,15 C 40,15 30,17 25,24 C 20,31 18,41 24,48 C 14,52 14,65 24,72 C 28,78 38,85 50,85" 
          fill="none" stroke="url(#goldGradCerebro)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    
    <!-- Symmetrical Right Cerebral Hemisphere Outline -->
    <path d="M 50,15 C 60,15 70,17 75,24 C 80,31 82,41 76,48 C 86,52 86,65 76,72 C 72,78 62,85 50,85" 
          fill="none" stroke="url(#goldGradCerebro)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

    <!-- Left Hemisphere Internal Brain Folds (Gyri/Sulci) -->
    <path d="M 50,23 C 41,23 35,27 35,35 C 35,42 41,45 50,45" fill="none" stroke="url(#emeraldGradCerebro)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 28,38 C 25,44 26,50 32,54" fill="none" stroke="url(#emeraldGradCerebro)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 50,55 C 41,55 35,61 35,69 C 35,76 43,80 50,80" fill="none" stroke="url(#emeraldGradCerebro)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Right Hemisphere Internal Brain Folds (Gyri/Sulci) -->
    <path d="M 50,23 C 59,23 65,27 65,35 C 65,42 59,45 50,45" fill="none" stroke="url(#emeraldGradCerebro)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 72,38 C 75,44 74,50 68,54" fill="none" stroke="url(#emeraldGradCerebro)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 50,55 C 59,55 65,61 65,69 C 65,76 57,80 50,80" fill="none" stroke="url(#emeraldGradCerebro)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Neural Connection Axons -->
    <line x1="50" y1="15" x2="35" y2="35" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="50" y1="15" x2="65" y2="35" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="25" y1="24" x2="35" y2="35" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="75" y1="24" x2="65" y2="35" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="24" y1="48" x2="32" y2="54" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="76" y1="48" x2="68" y2="54" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="24" y1="72" x2="35" y2="69" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>
    <line x1="76" y1="72" x2="65" y2="69" stroke="url(#goldGradCerebro)" stroke-width="0.75" opacity="0.4"/>

    <!-- Symmetrical Brain Synaptic Glow Nodes -->
    <circle cx="50" cy="15" r="3" fill="#FFF2A8" filter="drop-shadow(0 0 3px #D4AF37)"/>
    <circle cx="50" cy="85" r="3" fill="#FFF2A8" filter="drop-shadow(0 0 3px #D4AF37)"/>
    <circle cx="25" cy="24" r="2.5" fill="#FFF2A8" filter="drop-shadow(0 0 2px #D4AF37)"/>
    <circle cx="75" cy="24" r="2.5" fill="#FFF2A8" filter="drop-shadow(0 0 2px #D4AF37)"/>
    <circle cx="24" cy="48" r="3" fill="#FFF2A8" filter="drop-shadow(0 0 3px #D4AF37)"/>
    <circle cx="76" cy="48" r="3" fill="#FFF2A8" filter="drop-shadow(0 0 3px #D4AF37)"/>
    <circle cx="24" cy="72" r="2.5" fill="#FFF2A8" filter="drop-shadow(0 0 2px #D4AF37)"/>
    <circle cx="76" cy="72" r="2.5" fill="#FFF2A8" filter="drop-shadow(0 0 2px #D4AF37)"/>
    
    <!-- Internal Synaptic Emerald Transceivers -->
    <circle cx="35" cy="35" r="2" fill="#10B981" filter="drop-shadow(0 0 2px #10B981)"/>
    <circle cx="65" cy="35" r="2" fill="#10B981" filter="drop-shadow(0 0 2px #10B981)"/>
    <circle cx="35" cy="69" r="2" fill="#10B981" filter="drop-shadow(0 0 2px #10B981)"/>
    <circle cx="65" cy="69" r="2" fill="#10B981" filter="drop-shadow(0 0 2px #10B981)"/>

    <!-- Central Cognitive Spanner Core (Suspended Wrench) -->
    <g transform="translate(50,52) scale(0.42) translate(-50,-50)">
        <g transform="rotate(45,50,50)">
            <path d="M 56 85 L 56 68 L 60 68 L 60 45 L 75 30 L 75 10 L 58 10 L 58 28 L 42 28 L 42 10 L 25 10 L 25 30 L 40 45 L 40 68 L 44 68 L 44 85 Z" fill="rgba(16,185,129,0.12)" stroke="#10B981" stroke-width="4" stroke-linejoin="round"/>
            <rect x="46" y="74" width="3" height="5" fill="#0D0E15"/>
            <rect x="51" y="74" width="3" height="5" fill="#0D0E15"/>
            <rect x="48" y="40" width="4" height="24" rx="2" fill="#10B981" />
        </g>
    </g>
</svg>